<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily Bouquet</title>
<style>
  html, body { margin: 0; height: 100%; background: #040509; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         -webkit-user-select: none; user-select: none; touch-action: manipulation;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  #wrap { position: relative; height: 100vh; aspect-ratio: 27 / 50; max-width: 100vw; }
  canvas { width: 100%; height: 100%; display: block; }
  .pill {
    position: absolute; top: 1.6%; cursor: pointer;
    padding: .55em 1.2em; border: 2px solid #46464f; border-radius: 999px;
    background: rgba(4, 5, 9, .55); color: #e6e6ea;
    font-size: min(2.1vh, 3.9vw); font-family: inherit;
  }
  .pill:active { background: rgba(70, 70, 80, .5); }
  #again { left: 3.3%; }
  #wall  { right: 3.3%; }
  #name, #hint { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  #name { bottom: 6.4%; color: #ebebf0; font-size: min(3.5vh, 6.4vw); }
  #hint { bottom: 2.4%; color: #9696a0; font-size: min(1.6vh, 3vw); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="540" height="1000"></canvas>
  <button class="pill" id="again">&#8635; see me bloom again?</button>
  <button class="pill" id="wall">&#8595; wallpaper</button>
  <div id="name">Lily Mix</div>
  <div id="hint">my dear katie, tap anywhere to change the color</div>
</div>

<script>
// ---- tweakables ------------------------------------------------------------
const DENSITY = 1.0;   // lower = faster, higher = fuller
const SEED = 11;       // change for a different arrangement
// tap anywhere = next colour    Space = bloom again
// ----------------------------------------------------------------------------

const W = 540, H = 1000, SC = W / 3.7, OX = W / 2, OY = 746, DW = 6;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

const THEMES = [
  { name: 'Lily Mix',         base: null },
  { name: 'Navy Blue',        base: [25, 45, 210] },
  { name: 'Rose Pink',        base: [236, 84, 140] },
  { name: 'Crimson Red',      base: [214, 30, 52] },
  { name: 'Sunset Orange',    base: [245, 122, 36] },
  { name: 'Sunflower Yellow', base: [246, 202, 42] },
  { name: 'Lavender',         base: [162, 112, 236] },
  { name: 'Ocean Teal',       base: [22, 172, 172] }
];
const PAL = {
  red: ['#e8262b', '#7a0a10'], pink: ['#e65fb0', '#7a1a55'], white: ['#f4efe6', '#a89580'],
  peach: ['#e3a273', '#8a4a28'], yellow: ['#f0cf3a', '#a07018'], maroon: ['#a31224', '#3a050c'],
  purple: ['#c0457f', '#5a1a45'], cream: ['#e6d6c4', '#8a7058'], tan: ['#c79a78', '#6e4a30']
};
// x, y, size, rotation, tilt, squash, colour   (back -> front)
const FLOWERS = [
  [0.05, 3.80, 0.50, 10, 0, 0.90, 'tan'],    [-0.72, 3.50, 0.52, 35, 0, 0.85, 'cream'],
  [0.85, 3.50, 0.58, 20, -20, 0.80, 'yellow'], [-1.12, 2.45, 0.58, 15, 10, 0.85, 'yellow'],
  [1.12, 2.75, 0.62, 0, 0, 0.80, 'purple'],  [-0.02, 3.05, 0.98, 22, 0, 0.88, 'red'],
  [-0.66, 2.02, 0.84, 8, 0, 0.88, 'pink'],   [0.70, 1.85, 0.84, 30, 0, 0.88, 'white'],
  [1.12, 1.20, 0.62, 10, 40, 0.70, 'maroon'], [-1.15, 1.18, 0.62, 0, -20, 0.75, 'yellow'],
  [0.02, 1.12, 0.82, 15, 0, 0.88, 'peach']
];
const FV = [1, 0.9, 1.1, 0.85, 1.05, 1.15, 0.95, 1.0, 0.8, 1.1, 0.9];   // tone per flower in one-colour themes
const SPECKLED = ['white', 'pink', 'peach', 'cream'];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const D2R = Math.PI / 180, TAU = Math.PI * 2;

// ---- builds every particle; same layout for every colour theme -----------------
function build(theme) {
  let _s = (SEED * 2654435761) >>> 0;
  const rnd = () => {
    _s = (_s + 0x6D2B79F5) | 0;
    let t = Math.imul(_s ^ (_s >>> 15), 1 | _s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const uni = (a, b) => a + (b - a) * rnd();
  const norm = (sd = 1) => sd * Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(TAU * rnd());
  const base = THEMES[theme].base ? THEMES[theme].base.map(v => v / 255) : null;

  const FX = [], FY = [], MX = [], MY = [], AX = [], AY = [];
  const TB = [], D1 = [], TO = [], D2 = [], CR = [], CG = [], CB = [];
  function add(fx, fy, mx, my, ax, ay, tb, d1, to, d2, c) {
    FX.push(fx); FY.push(fy); MX.push(mx); MY.push(my); AX.push(ax); AY.push(ay);
    TB.push(tb); D1.push(d1); TO.push(to); D2.push(d2);
    CR.push(clamp(c[0]) * 255); CG.push(clamp(c[1]) * 255); CB.push(clamp(c[2]) * 255);
  }
  const bez = (p0, p1, p2, t) => {
    const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    return [a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]];
  };
  const RIM = 0.95;                                       // top of the cone

  // ---- the wrapper cone (drawn first, so everything sits in front of it) ----
  const bandCol = base ? [base[0] + 0.06, base[1] + 0.06, Math.min(1, base[2] + 0.08)] : [0.16, 0.24, 0.9];
  for (let k = Math.floor(1.97 * 8000 * DENSITY); k--;) {
    const x = uni(-0.93, 0.93), y = uni(-1.05, RIM), v = (RIM - y) / 2.0;
    if (Math.abs(x) > 0.93 - 0.875 * v) { rnd(); continue; }
    const g = 0.55 + 0.1 * rnd() + 0.06 * (x < 0 ? 1 : 0);
    let c = [g, g, g];
    if (y < -0.12 && y > -0.40 && Math.abs(x) < 0.48 - 0.36 * ((-0.12 - y) / 0.28) * 0.28) c = mul(bandCol, 0.9 + 0.2 * rnd());
    if (Math.hypot(x, y + 0.26) < 0.1) c = mul(mixc(bandCol, [1, 1, 1], 0.25), 1);
    add(x, y, x, y, x * 0.2, RIM, 0.05 + v * 0.5, 0.25, 0, 0.01, c);
  }

  // ---- grass ----
  for (let i = 0; i < 20; i++) {
    const x0 = norm(0.12), ang = norm(0.3), L = uni(0.8, 1.6);
    const p0 = [x0, RIM - 0.1], p2 = [x0 + Math.sin(ang) * L, RIM - 0.1 + Math.cos(ang) * L];
    const p1 = [(p0[0] + p2[0]) / 2 + norm(0.1), (p0[1] + p2[1]) / 2], ts = uni(0.3, 1.1);
    for (let k = Math.floor(70 * DENSITY); k--;) {
      const u = rnd(), q = bez(p0, p1, p2, u), x = q[0] + norm(0.012) * (1 - u), y = q[1];
      add(x, y, x, y, p0[0], p0[1], ts + u * 1.2, 0.2, 0, 0.01, [0.15 + 0.2 * u, 0.45 + 0.4 * u, 0.1 + 0.05 * u]);
    }
  }

  // ---- stems ----
  const stems = [];
  for (const [fx, fy] of FLOWERS) {
    const p0 = [uni(-0.3, 0.3), RIM - 0.12], p2 = [fx, fy - 0.05];
    const p1 = [(p0[0] + p2[0]) / 2 + norm(0.05), (p0[1] + p2[1]) / 2];
    stems.push([p0, p1, p2]);
    const len = Math.hypot(p2[0] - p0[0], p2[1] - p0[1]);
    for (let k = Math.floor(150 * len * DENSITY) + 20; k--;) {
      const u = rnd(), q = bez(p0, p1, p2, u), g = rnd();
      const x = q[0] + norm(0.004), y = q[1] + norm(0.004);
      add(x, y, x, y, x, y, 0.4 + u * 1.5, 0.12, 0, 0.01, [0.45 + 0.15 * g, 0.82 + 0.15 * g, 0.2 + 0.1 * g]);
    }
  }
  // ---- leaves ----
  function leaf(b0, side, theta, L, wmax, t0) {
    const d = [side * Math.sin(theta), Math.cos(theta)], pp = [-d[1], d[0]];
    for (let k = Math.floor(900 * L * (wmax / 0.07) * DENSITY) + 20; k--;) {
      const u = rnd(), v = uni(-1, 1), w = wmax * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.9);
      const x = b0[0] + d[0] * u * L + pp[0] * w * v + side * 0.12 * (u * L) ** 2;
      const y = b0[1] + d[1] * u * L + pp[1] * w * v - 0.45 * (u * L) ** 2;
      const c = Math.abs(v) < 0.09 ? [0.5, 0.85, 0.35] : [0.07 + 0.12 * u, 0.42 + 0.25 * u, 0.1 + 0.05 * u];
      add(x, y, x, y, b0[0], b0[1], t0 + u * 0.9, 0.2, 0, 0.01, mul(c, 0.85 + 0.3 * rnd()));
    }
  }
  for (let i = 0; i < 14; i++) {
    const s = uni(0.02, 0.22), st = stems[i % stems.length];
    leaf(bez(st[0], st[1], st[2], s), i % 2 ? 1 : -1, uni(0.45, 1.1), uni(0.55, 1.2), 0.06, 0.6 + s * 3);
  }
  for (let i = 0; i < 9; i++) {
    const s = uni(0.25, 0.6), st = stems[i % stems.length];
    leaf(bez(st[0], st[1], st[2], s), rnd() < 0.5 ? -1 : 1, uni(0.45, 0.9), uni(0.4, 0.7), 0.04, 0.9 + s * 2);
  }

  // ---- lilies: bud -> bloom ----
  const perm = FLOWERS.map((_, i) => i);
  for (let i = perm.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]];
  }
  FLOWERS.forEach(([fx, fy, L00, rot, tilt, sq, name], idx) => {
    const L0 = L00 * 1.12;
    let light, dark, speckled;
    if (base) {
      const bb = mul(base, FV[idx]);
      light = mixc(bb, [1, 1, 1], 0.12); dark = mul(bb, 0.3); speckled = true;
    } else {
      light = hex(PAL[name][0]); dark = hex(PAL[name][1]); speckled = SPECKLED.includes(name);
    }
    const tipx = fx, tipy = fy - 0.05;
    const tb = 1.7 + 0.10 * perm[idx], to = 2.4 + 0.20 * perm[idx];
    const tl = tilt * D2R, cs = Math.cos(tl), sn = Math.sin(tl);
    const M00 = cs * cs + sn * sn * sq, M01 = cs * sn * (1 - sq), M11 = sn * sn + cs * cs * sq;
    for (let layer = 0; layer < 2; layer++) {
      for (let j = 0; j < 3; j++) {
        const a = (rot + j * 120 + 60 * layer + norm(3)) * D2R;
        const L = L0 * (layer === 0 ? 1 : 0.92) * uni(0.95, 1.05), wmax = (layer === 0 ? 0.23 : 0.2) * L;
        const d = [Math.cos(a), Math.sin(a)], pp = [-d[1], d[0]];
        let dc = [Math.cos(a) * 0.28, 1]; const dl = Math.hypot(dc[0], dc[1]); dc = [dc[0] / dl, dc[1] / dl];
        const pc = [-dc[1], dc[0]], curl = j % 2 ? 1 : -1;
        for (let k = Math.floor(2300 * L * L * DENSITY) + 30; k--;) {
          const u = Math.pow(rnd(), 0.95), v = uni(-1, 1);
          const w = wmax * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.9);
          const cu = u * u * u * 0.06 * L * curl;
          const ox = u * L * d[0] + (w * v + cu) * pp[0], oy = u * L * d[1] + (w * v + cu) * pp[1];
          const mx = fx + u * L * 0.5 * dc[0] + w * v * 0.5 * pc[0], my = fy + u * L * 0.5 * dc[1] + w * v * 0.5 * pc[1];
          const m = clamp(0.15 + 0.85 * Math.pow(u, 0.6));
          let c = mixc(dark, light, m);
          const spk = rnd() < 0.07;
          if (u < 0.16) c = [0.55, 0.62, 0.2];
          if (Math.abs(v) < 0.1) c = mul(c, 0.8);
          if (Math.abs(v) > 0.85) c = mul(c, 1.1);
          if (u < 0.5 && speckled && spk) c = mul(dark, 0.6);
          add(fx + M00 * ox + M01 * oy, fy + M01 * ox + M11 * oy, mx, my, tipx, tipy,
              tb + 0.05 * j, 0.5, to + 0.06 * j + 0.1 * layer, 1.3,
              [c[0] + norm(0.03), c[1] + norm(0.03), c[2] + norm(0.03)]);
        }
      }
    }
    for (let k = 0; k < 6; k++) {
      const a = (rot + 30 + k * 60 + norm(8)) * D2R, Ls = 0.55 * L0, dx = Math.cos(a), dy = Math.sin(a);
      for (let i = Math.floor(55 * L0 * DENSITY) + 6; i--;) {
        const u = rnd(), ox = u * Ls * dx, oy = u * Ls * dy;
        add(fx + M00 * ox + M01 * oy, fy + M01 * ox + M11 * oy, fx, fy, tipx, tipy, tb + 0.1, 0.5, to + 0.3, 1.0, [0.85, 0.75, 0.45]);
      }
      for (let i = 0; i < 8; i++) {
        const ox = Ls * dx, oy = Ls * dy;
        add(fx + M00 * ox + M01 * oy + norm(0.012), fy + M01 * ox + M11 * oy + norm(0.012), fx, fy, tipx, tipy,
            tb + 0.1, 0.5, to + 0.3, 1.0, [0.6, 0.22, 0.06]);
      }
    }
  });

  // ---- baby's-breath filler: last, in front ----
  for (let i = 0; i < 30; i++) {
    const a = rnd() < 0.75 ? uni(Math.PI * 1.02, Math.PI * 1.98) : uni(-0.4, Math.PI + 0.4);
    const rad = uni(0.9, 1.65);
    const gx = Math.cos(a) * rad * 1.05, gy = 1.98 - Math.sin(a) * rad * 0.85;
    const q0 = 4.4 + (i / 30) * 1.4;
    for (let k = 0; k < 36; k++) {
      const u = k / 35, x = gx * u + norm(0.004), y = RIM + (gy - RIM) * u + norm(0.004);
      add(x, y, x, y, 0, RIM, q0, 0.5, 0, 0.01, [0.14, 0.4, 0.26]);
    }
    for (let sp = Math.floor(uni(10, 20) * DENSITY); sp--;) {
      const cx = gx + norm(0.17), cy = gy + norm(0.17), r = uni(0.02, 0.05);
      for (let k = 0; k < 5; k++) {
        add(cx + norm(r * 0.6), cy + norm(r * 0.6), cx, cy, gx, gy, q0 + 0.15, 0.7, 0, 0.01, [0.92, 0.92, 0.96]);
      }
    }
  }

  // ---- pack ----
  const N = FX.length, F = a => Float32Array.from(a);
  const col = new Uint32Array(N);
  for (let i = 0; i < N; i++) col[i] = (255 << 24) | (CB[i] << 16) | (CG[i] << 8) | CR[i];
  const SN = 220, st = { x: [], y: [], ph: [], sp: [], t0: [] };
  for (let i = 0; i < SN; i++) {
    st.x.push(uni(-2.6, 2.6)); st.y.push(uni(-1.6, 5.2));
    st.ph.push(uni(0, 6.28)); st.sp.push(uni(1, 3)); st.t0.push(uni(5, 8));
  }
  return { N, fx: F(FX), fy: F(FY), mx: F(MX), my: F(MY), ax: F(AX), ay: F(AY),
           tb: F(TB), d1: F(D1), to: F(TO), d2: F(D2), col, st, SN };
}

// ---- drawing: one function for the screen (s = 1) and the wallpaper (s = 2) -----
function draw(M, pix, Wp, Hp, s, t) {
  const { N, fx, fy, mx, my, ax, ay, tb, d1, to, d2, col, st, SN } = M;
  const sc = SC * s, ox = OX * s, oy = OY * s, dw = DW * s, rowStep = 2 * s;
  pix.fill(0xff04050a | 0);
  for (let i = 0; i < SN; i++) {
    const on = clamp(t - st.t0[i]);
    if (on <= 0) continue;
    const tw = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * st.sp[i] + st.ph[i]))) * on, v = (tw * 255) | 0;
    const x = (ox + st.x[i] * sc) | 0, y = (oy - st.y[i] * sc) | 0;
    if (x < 0 || x >= Wp - s || y < 0 || y >= Hp - s) continue;
    const c = (255 << 24) | (v << 16) | (v << 8) | v;
    for (let a = 0; a < s; a++) for (let b = 0; b < s; b++) pix[(y + a) * Wp + x + b] = c;
  }
  for (let i = 0; i < N; i++) {
    const q1 = (t - tb[i]) / d1[i];
    if (q1 <= 0) continue;
    const p1 = q1 > 1 ? 1 : q1;
    let p2 = (t - to[i]) / d2[i]; p2 = p2 < 0 ? 0 : p2 > 1 ? 1 : p2;
    const e1 = p1 * p1 * (3 - 2 * p1), e2 = p2 * p2 * (3 - 2 * p2);
    const x = (ox + (ax[i] + (mx[i] - ax[i]) * e1 + (fx[i] - mx[i]) * e2) * sc) | 0;
    let y = (oy - (ay[i] + (my[i] - ay[i]) * e1 + (fy[i] - my[i]) * e2) * sc) | 0;
    y = Math.floor(y / rowStep) * rowStep;                // scan-line rows
    if (y < 0 || y + s > Hp) continue;
    const c = col[i];
    for (let r = 0; r < s; r++) {
      const row = (y + r) * Wp;
      for (let dx = 0; dx < dw; dx++) {
        const xx = x + dx;
        if (xx >= 0 && xx < Wp) pix[row + xx] = c;
      }
    }
  }
}

// ---- app ---------------------------------------------------------------------------
const nameEl = document.getElementById('name');
let theme = 0, M = build(theme), start = performance.now();
function loop(now) {
  draw(M, buf, W, H, 1, (now - start) / 1000);
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function setTheme(t) { theme = t; nameEl.textContent = THEMES[t].name; M = build(t); }
const bloom = () => { start = performance.now(); };
addEventListener('pointerdown', e => {
  if (e.target.closest('.pill')) return;
  setTheme((theme + 1) % THEMES.length);
});
document.getElementById('again').addEventListener('click', bloom);
addEventListener('keydown', e => { if (e.code === 'Space') bloom(); });

document.getElementById('wall').addEventListener('click', () => {
  const s = 2, out = document.createElement('canvas');
  out.width = W * s; out.height = H * s;
  const octx = out.getContext('2d'), oimg = octx.createImageData(out.width, out.height);
  draw(M, new Uint32Array(oimg.data.buffer), out.width, out.height, s, 30);
  octx.putImageData(oimg, 0, 0);
  octx.textAlign = 'center'; octx.fillStyle = 'rgb(235,235,240)';
  octx.font = `${H * s * 0.034}px system-ui, "Segoe UI", Roboto, sans-serif`;
  octx.fillText(THEMES[theme].name, out.width / 2, out.height * 0.945);
  out.toBlob(blob => {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'lily-bouquet-' + THEMES[theme].name.toLowerCase().replace(/\s+/g, '-') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  });
});
</script>
</body>
</html>
